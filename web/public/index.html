<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>traxxx</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <div class="title-row">
            <h1><a href="#/" class="home-link">traxxx</a></h1>
            <div id="user-crumb" class="crumb" hidden>
                <a href="#/" class="back">‹ users</a>
                <span class="crumb-sep">/</span>
                <span id="crumb-user" class="crumb-user"></span>
            </div>
        </div>
        <div id="activity-controls" class="controls" hidden>
            <label>Type
                <select id="type"><option value="">All</option></select>
            </label>
            <label>From
                <input id="from" type="date" />
            </label>
            <label>To
                <input id="to" type="date" />
            </label>
            <label>Per page
                <select id="perPage">
                    <option value="10">10</option>
                    <option value="25" selected>25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="all">All</option>
                </select>
            </label>
            <button id="refresh">Refresh</button>
        </div>
    </header>
    <main>
        <section id="home-view" class="home-view">
            <h2 class="section-title">Pick a user</h2>
            <div id="user-grid" class="user-grid"></div>
            <p id="no-users" class="muted" hidden>No users yet — run <code>go run . --seed</code> in the server directory.</p>
        </section>

        <section id="activity-view" hidden>
            <section id="summary" class="summary"></section>
            <section id="breakdown" class="breakdown" hidden>
                <table id="breakdown-table">
                    <thead>
                        <tr>
                            <th>Activity</th>
                            <th>Count</th>
                            <th>Total time</th>
                            <th>Minutes</th>
                            <th>Share</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
            <table id="activities">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Duration</th>
                        <th>Track</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <p id="empty" class="muted" hidden>No activities match your filters.</p>
            <nav id="pager" class="pager" hidden>
                <button id="prevPage">‹ Prev</button>
                <span id="pageInfo" class="muted"></span>
                <button id="nextPage">Next ›</button>
            </nav>
        </section>
    </main>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="app.js"></script>
</body>
</html>
