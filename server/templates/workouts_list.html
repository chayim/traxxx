{{template "header" .}}
<div class="page-head">
  <h2>Workouts</h2>
  <a class="btn primary" href="/ui/templates/workouts/new">+ New template</a>
</div>

{{if .Workouts}}
<table>
<thead><tr><th>Date</th><th>Name</th><th>Exercises</th><th></th></tr></thead>
<tbody>
{{range .Workouts}}
<tr>
  <td>{{dateOnly .Date}}</td>
  <td><a href="/ui/workouts/{{.ID}}">{{.Name}}</a></td>
  <td>{{.ExCount}}</td>
  <td>
    <form method="post" action="/ui/workouts/delete" class="inline-form"
          onsubmit="return confirm('Delete this workout?');">
      <input type="hidden" name="id" value="{{.ID}}">
      <button class="danger" type="submit">Delete</button>
    </form>
  </td>
</tr>
{{end}}
</tbody>
</table>
{{else}}
<p class="muted">No workouts yet. Create a template under <a href="/ui/settings">Settings</a>, then clone it to today.</p>
{{end}}
{{template "footer" .}}
