name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: 'Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: 'Bug Fixes'
    labels:
      - 'fix'
      - 'bug'
  - title: 'Maintenance'
    labels:
      - 'chore'
      - 'refactor'
      - 'docs'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
      - 'feature'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bug'
      - 'chore'
  default: patch
template: |
  ## Changes

  $CHANGES

  ## Downloads

  Attached to this release:

  - `traxxx-server-linux-amd64` — Linux x86_64 server binary
  - `traxxx-server-linux-arm64` — Linux arm64 server binary
  - `traxxx-debug.apk` — Android debug APK (cleartext http allowed)
  - `traxxx-release-unsigned.apk` — Android release APK (unsigned)
